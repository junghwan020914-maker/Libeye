version: '3.8'

services:
  # 1. Reverse Proxy (Nginx)
  nginx:
    image: nginx:alpine
    container_name: libeye-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-server
      - minio
    networks:
      - libeye-network
    restart: unless-stopped

  # 2. Main API Server (FastAPI)
  api-server:
    build: 
      context: ./api
      dockerfile: Dockerfile
    container_name: libeye-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:libeye_admin_pwd@postgres:5432/libeye_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin1234
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - libeye-network
    restart: always

  # 3. AI Worker Nodes (Celery + GPU)
  ai-worker:
    build:
      context: ./ai_worker
      dockerfile: Dockerfile
    container_name: libeye-ai-worker
    environment:
      - DATABASE_URL=postgresql://postgres:libeye_admin_pwd@postgres:5432/libeye_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin1234
    depends_on:
      - redis
      - minio
      - postgres
    # 로컬 GPU 서버 VRAM 사용을 위한 설정 (NVIDIA Docker Toolkit 필요)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1  # 사용할 GPU 개수 (또는 'all')
              capabilities: [gpu]
    networks:
      - libeye-network
    restart: always

  # 4. Database (PostgreSQL 15+)
  postgres:
    image: postgres:15-alpine
    container_name: libeye-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: libeye_admin_pwd
      POSTGRES_DB: libeye_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d # 초기 DDL SQL 파일 매핑 경로
    networks:
      - libeye-network
    restart: unless-stopped

  # 5. Local Object Storage (MinIO)
  minio:
    image: minio/minio
    container_name: libeye-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API 통신 포트 (S3 호환)
      - "9001:9001" # 웹 UI 콘솔 포트
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin1234
    volumes:
      - minio_data:/data
    networks:
      - libeye-network
    restart: unless-stopped

  # 6. Message Queue (Redis)
  redis:
    image: redis:alpine
    container_name: libeye-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - libeye-network
    restart: unless-stopped

# 데이터 영구 보존을 위한 볼륨 설정
volumes:
  postgres_data:
  minio_data:
  redis_data:

# 컨테이너 간 통신을 위한 내부 네트워크
networks:
  libeye-network:
    driver: bridge
