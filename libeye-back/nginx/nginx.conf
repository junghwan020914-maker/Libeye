user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 클라이언트(태블릿 등)에서 큰 이미지(스캔 사진)를 업로드할 수 있도록 허용 용량 증가 (예: 50MB)
    client_max_body_size 50M;

    server {
        listen       80;
        server_name  localhost;

        # 1. API 서버 라우팅 (/api/ 경로는 FastAPI로 전달)
        location /api/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. MinIO 스토리지 라우팅 (/original-bucket/ 등은 MinIO로 전달)
        # S3 호환 API를 위해 Host 헤더 등을 보존해야 함
        location /original-bucket/ {
            proxy_pass http://minio:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Presigned URL 서명 불일치 방지를 위해 설정
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # 3. MinIO 콘솔 웹 UI 라우팅 (선택 사항)
        location /minio-ui/ {
             proxy_pass http://minio:9001/;
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
        }

        # (추후 프론트엔드 정적 파일 서빙 시 아래 주석 해제 및 수정)
        # location / {
        #     root   /usr/share/nginx/html;
        #     index  index.html index.htm;
        #     try_files $uri $uri/ /index.html;
        # }
    }
}
