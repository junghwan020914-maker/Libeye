version: '3.8'

services:
  # 1. Database (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: libeye-postgres
    environment:
      POSTGRES_DB: libeye_db
      POSTGRES_USER: libeye_admin
      POSTGRES_PASSWORD: libeye_admin_pwd
    ports:
      - "5432:5432" # 외부 DB 툴(DBeaver 등) 접속 허용
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      # 👇 여기에 아래 한 줄을 추가합니다. (방금 만든 파일을 컨테이너 내부로 연결)
      - ./init-db/01-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - libeye-network

  # 2. Local Object Storage (MinIO)
  minio:
    image: minio/minio
    container_name: libeye-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin1234
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # 내부 API 통신용
      - "9001:9001" # 웹 브라우저 관리자 페이지용 (핵심!)
    volumes:
      - ./minio_data:/data
    networks:
      - libeye-network

  # 3. Message Queue (Redis)
  redis:
    image: redis:7-alpine
    container_name: libeye-redis
    networks:
      - libeye-network

  # 4. Ollama (AI Model Engine)
  ollama:
    image: ollama/ollama
    container_name: libeye-ollama
    #ports:
    #  - "11434:11434"
    volumes:
      - /home/gpuadmin/ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - libeye-network

  # 5. Main API Server (FastAPI)
  api:
    build: ./api
    container_name: libeye-api
    environment:
      - DATABASE_URL=postgresql://libeye_admin:libeye_admin_pwd@postgres/libeye_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_URL=http://minio:9000
      # ⬇️ ngrok으로 MinIO를 외부에 노출할 때 사용하는 공개 URL
      # ngrok 대시보드(localhost:4040)에서 minio 터널의 URL을 확인 후 여기에 입력하세요
      - MINIO_PUBLIC_URL=https://pyramidlike-distendedly-debroah.ngrok-free.dev
    ports:
      - "8000:8000" # 프론트엔드 대시보드 통신용
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - libeye-network

  # 6. AI Worker
  ai-worker:
    build: ./ai_worker
    container_name: libeye-ai-worker
     # -------- 👇 이 줄을 새로 추가해 주세요! --------
    command: celery -A pipeline worker --pool=solo --loglevel=info
    # ------------------------------------------------
    
    environment:
      - DATABASE_URL=postgresql://libeye_admin:libeye_admin_pwd@postgres/libeye_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_URL=http://minio:9000
      - OLLAMA_URL=http://ollama:11434/api/generate
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - redis
      - ollama
    networks:
      - libeye-network

# 7. Ngrok (외부 접속용 터널링) - 다중 터널: 프론트엔드 + MinIO
  ngrok:
    image: ngrok/ngrok:latest
    container_name: libeye-ngrok
    restart: unless-stopped
    # config 파일을 통해 프론트엔드와 MinIO 두 터널을 동시에 실행
    command:
      - "start"
      - "--all"
      - "--config=/etc/ngrok.yml"
    environment:
      - NGROK_AUTHTOKEN=3BTTdOr7CaswL3LriIefCKQcMlv_3VtBBpR5Z8VDaQaziFDuH
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml  # config 파일 마운트
    ports:
      - "4040:4040" # ngrok 웹 대시보드 포트 (터널 URL 확인용)
    networks:
      - libeye-network

# 8. Adminer (웹 기반 DB 관리 도구)
  adminer:
    image: adminer
    container_name: libeye-adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - libeye-network

networks:
  libeye-network:
    driver: bridge
    name: libeye-network
